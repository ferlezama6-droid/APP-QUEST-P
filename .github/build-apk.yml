name: Compilar APK de Quest Log

on:
  push:
    paths:
      - "**"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependencias (Capacitor)
        run: npm install

      - name: Sincronizar el proyecto Android
        run: npx cap sync android

      - name: Dar permisos a gradlew
        run: chmod +x android/gradlew

      - name: Compilar el APK (debug, sin firma, listo para instalar)
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Subir el APK generado
        uses: actions/upload-artifact@v4
        with:
          name: quest-log-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
