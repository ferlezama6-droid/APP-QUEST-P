<!DOCTYPE html>
<html lang="es" data-theme="dark" data-scale="normal">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1117">
<title>Quest Log</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0E1117; --surface:#141A25; --surface2:#18202D; --line:#1D2433; --border:#2A3345;
  --ring:#39425A; --acc:#5EE0CE; --acc-hi:#7AEBDB; --on-acc:#0E1117;
  --ink:#E7ECF5; --ink2:#7C8AA8; --ink3:#5A6580;
  --hi:#FF6B6B; --mid:#FFC24B; --low:#6FCF97; --pos:#3ED66B; --ev:#8AA4FF;
  --got-bg:#16241F; --got-bd:#2E6B60; --veil:rgba(6,8,12,.72); --s:1;
}
html[data-theme="light"]{
  --bg:#F4F6FA; --surface:#FFFFFF; --surface2:#EFF3F9; --line:#E2E8F2; --border:#D7DFEC;
  --ring:#C3CDDF; --acc:#0E7F73; --acc-hi:#0B6A60; --on-acc:#FFFFFF;
  --ink:#16223A; --ink2:#6B7A99; --ink3:#8B98B0;
  --hi:#C0392F; --mid:#8A5B06; --low:#1E7A4E; --pos:#1E7A4E; --ev:#3D5BC4;
  --got-bg:#E6F4F1; --got-bd:#8CC9C0; --veil:rgba(22,34,58,.35);
}
html[data-scale="compacta"]{--s:.93} html[data-scale="grande"]{--s:1.12}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;overscroll-behavior:none}
button,input,textarea{font-family:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--acc);text-decoration:none}
a:hover{color:var(--acc-hi)}
#app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;position:relative;overflow:hidden}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
.eyebrow{font:500 calc(10.5px*var(--s))/1 'IBM Plex Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--acc)}
.eyebrow.dim{color:var(--ink2)}
.hero .eyebrow{white-space:nowrap}
header{display:flex;align-items:center;gap:10px;padding:max(14px,env(safe-area-inset-top)) 20px 14px}
header .date{font:500 calc(10px*var(--s))/1 'IBM Plex Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2)}
header h1{margin:5px 0 0;font:600 calc(20px*var(--s))/1.1;letter-spacing:-.01em}
.ghost{border:1px solid var(--border);background:transparent;color:var(--ink2);border-radius:10px;padding:9px 12px;font:600 calc(11.5px*var(--s)) 'IBM Plex Sans',sans-serif;min-height:38px}
.ghost:hover{border-color:var(--acc);color:var(--acc)}
.avatar{width:38px;height:38px;flex:none;border-radius:50%;border:1.5px solid var(--got-bd);background:var(--got-bg);color:var(--acc);font:600 calc(12px*var(--s))/1 'IBM Plex Mono',monospace}
main{flex:1;overflow-y:auto;padding:0 20px 84px;display:flex;flex-direction:column;gap:16px;-webkit-overflow-scrolling:touch}
.card{border:1px solid var(--line);border-radius:18px;padding:18px;background:var(--surface)}
.hero{border:1px solid var(--line);border-radius:18px;padding:18px;background:var(--surface)}
.hero .count{font:500 calc(46px*var(--s))/.9 'IBM Plex Mono',monospace;letter-spacing:-.03em}
.hero .unit{font:400 calc(12px*var(--s))/1.2;color:var(--ink2);padding-bottom:6px}
.hero h2{margin:10px 0 0;font:600 calc(17px*var(--s))/1.3}
.hero .sub{font:400 calc(12.5px*var(--s))/1.4;color:var(--ink2);margin-top:3px}
.btn{border:0;background:var(--acc);color:var(--on-acc);border-radius:13px;padding:14px;font:600 calc(14px*var(--s)) 'IBM Plex Sans',sans-serif;min-height:46px}
.btn:hover{background:var(--acc-hi)}
.btn.out{background:transparent;border:1px solid var(--border);color:var(--ink)}
.btn.out:hover{background:transparent;border-color:var(--acc)}
.btn.danger{background:transparent;border:1px solid var(--border);color:var(--hi)}
.btn[disabled]{background:var(--line);color:var(--ink3);cursor:default}
.seg{display:flex;gap:4px;padding:4px;background:var(--surface);border-radius:12px}
.seg button{flex:1;border:0;border-radius:9px;padding:10px 0;background:transparent;color:var(--ink2);font:600 calc(12px*var(--s)) 'IBM Plex Sans',sans-serif;min-height:40px}
.seg button[aria-selected="true"]{background:var(--acc);color:var(--on-acc)}
.list{display:flex;flex-direction:column;gap:9px}
.row{display:flex;gap:13px;align-items:center;padding:13px 14px;background:var(--surface);border-radius:14px;border-left:2px solid var(--line);text-align:left;border-top:0;border-right:0;border-bottom:0;width:100%}
.row:hover{background:var(--surface2)}
.row .ttl{display:block;font:600 calc(14px*var(--s))/1.3}
.row .meta{display:block;font:400 calc(12px*var(--s))/1.35;color:var(--ink2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .due{font:500 calc(12px*var(--s))/1 'IBM Plex Mono',monospace;color:var(--ink2);flex:none}
.row.done .ttl{color:var(--ink2);text-decoration:line-through}
.box{width:24px;height:24px;flex:none;border-radius:6px;border:1.5px solid var(--ring);background:transparent;color:var(--on-acc);font:700 calc(12px*var(--s)) sans-serif;display:flex;align-items:center;justify-content:center;padding:0}
.box[aria-checked="true"]{border-color:var(--acc);background:var(--acc)}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chips.grid{display:grid;grid-template-columns:1fr 1fr}
.chip{flex:1;min-width:64px;border:1px solid var(--border);background:transparent;color:var(--ink2);border-radius:10px;padding:11px 8px;font:600 calc(11.5px*var(--s))/1.25 'IBM Plex Sans',sans-serif;min-height:42px}
.chip[aria-pressed="true"]{border-color:var(--acc);background:var(--acc);color:var(--on-acc)}
.chip.pill{flex:none;border-radius:20px;padding:9px 14px}
.chip.soft[aria-pressed="true"]{background:var(--line);color:var(--ink);border-color:var(--acc)}
.field{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:13px 14px;font:400 calc(14px*var(--s)) 'IBM Plex Sans',sans-serif;outline:none}
.field:focus{border-color:var(--acc)}
textarea.field{min-height:76px;resize:vertical;line-height:1.5}
.lbl{font:500 calc(10.5px*var(--s))/1 'IBM Plex Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);margin-bottom:8px}
.empty{padding:17px 15px;border:1px dashed var(--border);border-radius:14px;font:400 calc(12.5px*var(--s))/1.5;color:var(--ink3)}
.dash{border:1px dashed var(--border);background:transparent;color:var(--ink2);border-radius:14px;padding:14px 16px;font:600 calc(12.5px*var(--s)) 'IBM Plex Sans',sans-serif;text-align:left;width:100%}
.dash:hover{border-color:var(--acc);color:var(--acc)}
.bar{height:3px;border-radius:2px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc)}
nav{display:flex;padding:10px 12px max(18px,env(safe-area-inset-bottom));gap:4px;border-top:1px solid var(--line);background:var(--bg)}
nav button{flex:1;border:0;background:transparent;padding:8px 0 4px;display:flex;flex-direction:column;align-items:center;gap:7px;color:var(--ink3);font:600 calc(11px*var(--s)) 'IBM Plex Sans',sans-serif;min-height:52px}
nav button i{width:20px;height:20px;border:1.7px solid currentColor;background:transparent}
nav button:nth-child(1) i{border-radius:50%} nav button:nth-child(2) i{border-radius:5px}
nav button:nth-child(3) i{border-radius:3px} nav button:nth-child(4) i{border-radius:50%}
nav button[aria-current="page"]{color:var(--acc)}
nav button[aria-current="page"] i{background:var(--acc)}
.fab{position:absolute;right:18px;bottom:calc(84px + env(safe-area-inset-bottom));width:54px;height:54px;border-radius:50%;border:0;background:var(--acc);color:var(--on-acc);font:400 26px/1 sans-serif;box-shadow:0 8px 20px rgba(0,0,0,.4)}
.scrim{position:absolute;inset:0;background:var(--veil);display:flex;align-items:flex-end;z-index:20}
.sheet{width:100%;max-height:92%;overflow-y:auto;background:var(--surface);border-top:1px solid var(--border);
  border-radius:22px 22px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:15px}
.sheet.full{max-height:100%;height:100%;border-radius:0;background:var(--bg);padding-top:max(18px,env(safe-area-inset-top))}
.sheet h3{margin:0;font:600 calc(17px*var(--s))/1.25}
.x{border:0;background:transparent;color:var(--ink2);font:400 22px/1 sans-serif;padding:0 4px}
.x:hover{color:var(--ink)}
.sheet-hd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal button{border:0;background:transparent;color:var(--ink);aspect-ratio:1;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:500 calc(12.5px*var(--s))/1 'IBM Plex Mono',monospace;padding:0}
.cal button.today{background:var(--line)}
.cal button[aria-selected="true"]{background:var(--acc);color:var(--on-acc)}
.cal button u{width:4px;height:4px;border-radius:50%;background:currentColor;opacity:0}
.cal button.has u{opacity:1}
.cal .wd{text-align:center;font:500 calc(10px*var(--s))/1 'IBM Plex Mono',monospace;color:var(--ink3);padding:4px 0}
.sw{width:40px;height:23px;flex:none;border:0;border-radius:12px;background:var(--border);position:relative;padding:0}
.sw i{position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;background:var(--bg);transition:left .14s ease}
.sw[aria-checked="true"]{background:var(--acc)} .sw[aria-checked="true"] i{left:19px}
.tr{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.tr .t{flex:1;min-width:0;font:400 calc(13px*var(--s))/1.35}
.kpis{display:flex;gap:9px}
.kpi{flex:1;padding:13px;background:var(--surface);border-radius:14px}
.kpi b{display:block;font:500 calc(22px*var(--s))/1 'IBM Plex Mono',monospace}
.kpi span{display:block;font:400 calc(11px*var(--s))/1.3;color:var(--ink2);margin-top:6px}
.badges{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.badge{padding:13px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.badge.got{background:var(--got-bg);border-color:var(--got-bd)}
.badge em{font:500 calc(14px*var(--s))/1 'IBM Plex Mono',monospace;font-style:normal;color:var(--ink3)}
.badge.got em{color:var(--acc)}
.badge b{display:block;font:600 calc(12.5px*var(--s))/1.25;margin-top:9px}
.badge span{display:block;font:400 calc(11px*var(--s))/1.35;color:var(--ink2);margin-top:3px}
.week{display:flex;gap:8px;align-items:flex-end;height:110px}
.week div{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;height:100%;justify-content:flex-end}
.week i{width:100%;border-radius:5px 5px 2px 2px;background:var(--acc)}
.week span{font:500 calc(10.5px*var(--s))/1 'IBM Plex Mono',monospace;color:var(--ink2)}
.streak{display:flex;gap:4px}
.streak i{flex:1;height:34px;border-radius:6px;background:var(--line)}
.streak i.on{background:var(--acc)}
.toast{position:absolute;left:20px;right:20px;bottom:calc(96px + env(safe-area-inset-bottom));background:var(--surface);
  border:1px solid var(--border);border-radius:13px;padding:13px 15px;font:500 calc(12.5px*var(--s))/1.4;z-index:40;
  box-shadow:0 10px 24px rgba(0,0,0,.35);display:flex;gap:12px;align-items:center}
.toast b{color:var(--acc);font-family:'IBM Plex Mono',monospace;font-weight:500}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (min-width:520px){#app{min-height:100vh;border-left:1px solid var(--line);border-right:1px solid var(--line)}}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ------------------------------------------------------------------ store */
const KEY = 'questlog.v3';
const PRI = { Alta:'var(--hi)', Media:'var(--mid)', Baja:'var(--low)' };
const MONTHS = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DAYS = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
const HUES = ['var(--acc)','var(--ev)','var(--mid)','var(--low)','var(--hi)'];
const today = () => { const d = new Date(); return d.toISOString().slice(0,10); };
const uid = p => p + Math.random().toString(36).slice(2,9);

function seed() {
  const t = new Date(), iso = n => { const d = new Date(t); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); };
  return {
    onboarded:false,
    profile:{ name:'', carrera:'', sem:'4º–6º', goal:'2 tareas', hour:'20:00' },
    settings:{ theme:'dark', scale:'normal', notif:{ tareas:true, eventos:true, dinero:false, racha:true } },
    courses:[
      { id:'c1', name:'Teoría de la información aplicada', room:'Edif. B · 204', days:[0,2,4], hour:'16:00' },
      { id:'c2', name:'Diseño de políticas de seguridad', room:'En línea', days:[1,3], hour:'10:00' },
      { id:'c3', name:'Criptografía aplicada', room:'Edif. A · 110', days:[2], hour:'08:00' }
    ],
    tasks:[
      { id:'t1', title:'Examen parcial', course:'c1', date:iso(0), time:'16:00', pri:'Alta', dif:'Difícil', rec:'No se repite', rem:'1 día antes', notes:'', subs:[], done:false },
      { id:'t2', title:'Actividad 1', course:'c2', date:iso(0), time:'23:59', pri:'Alta', dif:'Media', rec:'No se repite', rem:'1 h antes', notes:'', subs:[], done:false },
      { id:'t3', title:'Leer capítulo 4', course:'c3', date:iso(1), time:'', pri:'Media', dif:'Fácil', rec:'Semanal', rem:'1 h antes', notes:'', subs:[], done:false },
      { id:'t4', title:'Pagar internet', course:'', date:iso(3), time:'', pri:'Baja', dif:'Fácil', rec:'Mensual', rem:'1 día antes', notes:'', subs:[], done:false }
    ],
    events:[
      { id:'e1', title:'Entrega de proyecto final', date:iso(4), time:'23:59', place:'En línea' },
      { id:'e2', title:'Asesoría con el profesor', date:iso(2), time:'11:00', place:'Cubículo 7' }
    ],
    accounts:[
      { id:'a1', name:'BBVA · 4417', kind:'Débito', balance:3180 },
      { id:'a2', name:'Efectivo', kind:'Cartera', balance:420 },
      { id:'a3', name:'Nu · crédito', kind:'Crédito · corte 5 · pago 25', balance:-1240, limit:8000, credit:true }
    ],
    tx:[
      { id:'x1', kind:'Gasto', amount:48, cat:'Comida', acct:'a2', date:iso(0), note:'Cafetería' },
      { id:'x2', kind:'Ingreso', amount:2400, cat:'Beca', acct:'a1', date:iso(-9), note:'Beca' },
      { id:'x3', kind:'Gasto', amount:26, cat:'Transporte', acct:'a2', date:iso(-1), note:'Camión' },
      { id:'x4', kind:'Gasto', amount:85, cat:'Escuela', acct:'a2', date:iso(-2), note:'Copias' }
    ],
    xp:50, streak:3, lastDone:iso(-1), history:[]
  };
}
let S;
try { S = JSON.parse(localStorage.getItem(KEY)) || seed(); } catch (e) { S = seed(); }
if (!S.tasks) S = seed();
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

/* ------------------------------------------------------------------ ui state */
const U = { view:'Hoy', seg:'Hoy', ag:'Lista', mon:'Resumen', txf:'Todo', ptab:'Logros',
            sheet:null, sel:null, day:today(), q:'', timer:{ left:1500, run:false },
            step:0, draft:{}, toast:null };

/* ------------------------------------------------------------------ helpers */
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const course = id => S.courses.find(c => c.id === id);
const courseName = id => (course(id) || {}).name || 'Personal';
const courseHue = id => { const i = S.courses.findIndex(c => c.id === id); return i < 0 ? 'var(--line)' : HUES[i % HUES.length]; };
const level = () => Math.floor(S.xp / 120) + 1;
const xpInLevel = () => (S.xp % 120) + ' / 120 XP';
const fmt = n => (n < 0 ? '−$' : '$') + Math.abs(n).toLocaleString('es-MX');
const money = n => (n > 0 ? '+' : n < 0 ? '−' : '') + '$' + Math.abs(n).toLocaleString('es-MX');
function dayLabel(iso) {
  const d = new Date(iso + 'T12:00'), t = new Date(today() + 'T12:00');
  const diff = Math.round((d - t) / 864e5);
  if (diff === 0) return 'hoy'; if (diff === 1) return 'mañana'; if (diff === -1) return 'ayer';
  if (diff > 1 && diff < 7) return DAYS[(d.getDay() + 6) % 7].toLowerCase();
  return d.getDate() + ' ' + MONTHS[d.getMonth()].slice(0,3);
}
function hoursLeft(t) {
  if (!t) return null;
  const when = new Date(t.date + 'T' + (t.time || '23:59'));
  const h = (when - new Date()) / 36e5;
  if (h < 0) return { late:true, txt:'vencida' };
  return { late:false, txt:String(Math.floor(h)).padStart(2,'0') + ':' + String(Math.floor((h % 1) * 60)).padStart(2,'0') };
}
const pending = () => S.tasks.filter(t => !t.done);
const sortedTasks = arr => arr.slice().sort((a,b) => (a.date + (a.time||'99:99')).localeCompare(b.date + (b.time||'99:99')));
const nextTask = () => sortedTasks(pending())[0];
function toast(msg) { U.toast = msg; render(); clearTimeout(toast._t); toast._t = setTimeout(() => { U.toast = null; render(); }, 2200); }

/* ------------------------------------------------------------------ actions */
function toggleTask(id) {
  const t = S.tasks.find(x => x.id === id); if (!t) return;
  t.done = !t.done;
  if (t.done) {
    const gain = ({ Fácil:10, Media:20, Difícil:30 })[t.dif] || 10;
    S.xp += gain;
    S.history.unshift({ id:uid('h'), title:t.title, course:t.course, xp:gain, date:today() });
    if (S.lastDone !== today()) {
      const y = new Date(); y.setDate(y.getDate()-1);
      S.streak = S.lastDone === y.toISOString().slice(0,10) ? S.streak + 1 : 1;
      S.lastDone = today();
    }
    toast('Completada · <b>+' + gain + ' XP</b>');
  } else {
    S.history = S.history.filter(h => h.title !== t.title);
  }
  save(); render();
}
function addTask(d) {
  S.tasks.push({ id:uid('t'), title:d.title.trim(), course:d.course || '', date:d.date || today(),
                 time:d.time || '', pri:d.pri || 'Media', dif:d.dif || 'Media', rec:d.rec || 'No se repite',
                 rem:d.rem || '1 h antes', notes:'', subs:[], done:false });
  save();
}
function patchTask(id, patch) { const t = S.tasks.find(x => x.id === id); if (t) { Object.assign(t, patch); save(); } }
function delTask(id) { S.tasks = S.tasks.filter(t => t.id !== id); save(); }
function addTx(d) {
  const amt = Math.abs(parseFloat(d.amount) || 0); if (!amt) return false;
  S.tx.unshift({ id:uid('x'), kind:d.kind, amount:amt, cat:d.cat, acct:d.acct, to:d.to || '', date:today(), note:d.note || d.cat });
  const a = S.accounts.find(x => x.id === d.acct);
  if (a) a.balance += d.kind === 'Ingreso' ? amt : -amt;
  if (d.kind === 'Transferencia') { const b = S.accounts.find(x => x.id === d.to); if (b) b.balance += amt; }
  save(); return true;
}
function monthTotals() {
  const m = today().slice(0,7);
  let inc = 0, out = 0;
  S.tx.filter(t => t.date.slice(0,7) === m).forEach(t => {
    if (t.kind === 'Ingreso') inc += t.amount; else if (t.kind === 'Gasto') out += t.amount;
  });
  return { inc, out, net:inc - out };
}
function cats() {
  const m = today().slice(0,7), map = {};
  S.tx.filter(t => t.date.slice(0,7) === m && t.kind === 'Gasto').forEach(t => { map[t.cat] = (map[t.cat] || 0) + t.amount; });
  const arr = Object.keys(map).map(k => ({ name:k, amount:map[k] })).sort((a,b) => b.amount - a.amount);
  const max = arr.reduce((s,c) => s + c.amount, 0) || 1;
  return arr.map((c,i) => Object.assign(c, { pct:Math.round(c.amount / max * 100), hue:HUES[i % HUES.length] }));
}
function achievements() {
  const doneAll = S.history.length;
  return [
    { n:'Primera tarea', d:'Completa una tarea', got:doneAll >= 1 },
    { n:'Racha de 3', d:'3 días seguidos', got:S.streak >= 3 },
    { n:'Diez hechas', d:'10 tareas completadas', got:doneAll >= 10 },
    { n:'Nivel 2', d:'Llega a 120 XP', got:S.xp >= 120 },
    { n:'Mes en positivo', d:'Cierra el mes con neto +', got:monthTotals().net > 0 },
    { n:'Horario completo', d:'3 materias con horario', got:S.courses.filter(c => c.days && c.days.length).length >= 3 }
  ];
}

/* ------------------------------------------------------------------ render: pieces */
function taskRow(t) {
  const h = hoursLeft(t);
  return `<button class="row${t.done ? ' done' : ''}" style="border-left-color:${PRI[t.pri]}" data-act="open" data-id="${t.id}">
    <span class="box" role="checkbox" aria-checked="${t.done}" data-act="toggle" data-id="${t.id}">${t.done ? '✓' : ''}</span>
    <span style="flex:1;min-width:0">
      <span class="ttl">${esc(t.title)}</span>
      <span class="meta">${esc(courseName(t.course))}${t.time ? ' · ' + t.time : ''}</span>
    </span>
    <span class="due">${t.done ? '' : (h.late ? 'vencida' : dayLabel(t.date))}</span>
  </button>`;
}
const segBar = (items, cur, act) => `<div class="seg" role="tablist">${items.map(i =>
  `<button role="tab" aria-selected="${i === cur}" data-act="${act}" data-v="${i}">${i}</button>`).join('')}</div>`;
const chipRow = (items, cur, act, cls) => `<div class="chips">${items.map(i =>
  `<button class="chip ${cls || ''}" aria-pressed="${i === cur}" data-act="${act}" data-v="${esc(i)}">${esc(i)}</button>`).join('')}</div>`;

/* ------------------------------------------------------------------ screens */
function viewHoy() {
  const n = nextTask(), h = hoursLeft(n);
  const list = sortedTasks(S.tasks).filter(t => {
    if (U.seg === 'Todo') return true;
    const lim = new Date(); lim.setDate(lim.getDate() + (U.seg === 'Hoy' ? 0 : 6));
    return t.date <= lim.toISOString().slice(0,10);
  });
  const goal = parseInt(S.profile.goal) || 2;
  const doneToday = S.history.filter(x => x.date === today()).length;
  return `
  ${n ? `<section class="hero">
    <div class="eyebrow">Entrega más próxima</div>
    <div style="display:flex;align-items:flex-end;gap:9px;margin:12px 0 4px">
      <div class="count">${h.txt}</div>
      <div class="unit">${h.late ? '' : 'horas<br>restantes'}</div>
    </div>
    <h2>${esc(n.title)}</h2>
    <div class="sub">${esc(courseName(n.course))}${n.time ? ' · ' + n.time : ''}</div>
    <div style="display:flex;gap:8px;margin-top:16px">
      <button class="btn" style="flex:1" data-act="focus" data-id="${n.id}">Abrir y enfocarme</button>
      <button class="btn out" data-act="new">Agregar</button>
    </div>
  </section>` : `<div class="empty">Sin pendientes. Toca ＋ para agregar una tarea.</div>`}

  <section style="display:flex;align-items:center;gap:12px;padding:13px 15px;background:var(--surface);border-radius:14px">
    <div style="flex:1;min-width:0">
      <div style="font:600 calc(12.5px*var(--s))/1.2">Misión del día</div>
      <div style="font:400 calc(11.5px*var(--s))/1.3;color:var(--ink2);margin-top:4px">${Math.min(doneToday,goal)} de ${goal} tareas</div>
      <div class="bar" style="margin-top:9px"><i style="width:${Math.min(100, doneToday / goal * 100)}%"></i></div>
    </div>
    <div class="mono" style="font-size:calc(12px*var(--s));color:var(--acc)">+${goal * 20} XP</div>
  </section>

  ${segBar(['Hoy','Semana','Todo'], U.seg, 'seg')}
  <div class="list">
    ${list.length ? list.map(taskRow).join('') : `<div class="empty">Nada en este rango.</div>`}
    <div class="mono" style="font-size:calc(11.5px*var(--s));color:var(--ink3);padding:6px 2px 0">
      ${doneToday === 0 ? 'Nada completado hoy' : doneToday + (doneToday === 1 ? ' tarea hecha hoy' : ' tareas hechas hoy')}
    </div>
  </div>`;
}

function calendar() {
  const base = new Date(U.day + 'T12:00'), y = base.getFullYear(), m = base.getMonth();
  const first = new Date(y, m, 1), offset = (first.getDay() + 6) % 7, days = new Date(y, m+1, 0).getDate();
  const marks = {};
  S.tasks.forEach(t => { if (t.date.slice(0,7) === U.day.slice(0,7)) marks[+t.date.slice(8)] = 1; });
  S.events.forEach(e => { if (e.date.slice(0,7) === U.day.slice(0,7)) marks[+e.date.slice(8)] = 1; });
  let cells = '';
  for (let i = 0; i < offset; i++) cells += '<button disabled style="opacity:0"></button>';
  for (let d = 1; d <= days; d++) {
    const iso = y + '-' + String(m+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
    cells += `<button class="${marks[d] ? 'has ' : ''}${iso === today() ? 'today' : ''}" aria-selected="${iso === U.day}" data-act="day" data-v="${iso}">${d}<u></u></button>`;
  }
  const dayTasks = sortedTasks(S.tasks.filter(t => t.date === U.day));
  const dayEv = S.events.filter(e => e.date === U.day);
  return `
  <section class="card" style="padding:16px 14px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <div style="font:600 calc(13.5px*var(--s))/1;text-transform:capitalize">${MONTHS[m]} ${y}</div>
      <div style="display:flex;gap:6px">
        <button class="ghost" style="padding:6px 10px;min-height:0" data-act="mon-" >‹</button>
        <button class="ghost" style="padding:6px 10px;min-height:0" data-act="mon+">›</button>
      </div>
    </div>
    <div class="cal" style="margin-bottom:6px">${['L','M','M','J','V','S','D'].map(d => `<div class="wd">${d}</div>`).join('')}</div>
    <div class="cal">${cells}</div>
  </section>
  <div>
    <div class="lbl">${new Date(U.day + 'T12:00').getDate()} de ${MONTHS[new Date(U.day + 'T12:00').getMonth()]}</div>
    <div class="list">
      ${dayTasks.map(taskRow).join('')}
      ${dayEv.map(e => `<div class="row" style="border-left-color:var(--ev)"><span style="flex:1"><span class="ttl">${esc(e.title)}</span><span class="meta">${e.time} · ${esc(e.place)}</span></span></div>`).join('')}
      ${(!dayTasks.length && !dayEv.length) ? `<div class="empty">Nada agendado ese día.</div>` : ''}
    </div>
  </div>`;
}

function viewAgenda() {
  let body = '';
  if (U.ag === 'Lista') {
    const l = sortedTasks(S.tasks);
    body = `<div class="list">${l.length ? l.map(taskRow).join('') : '<div class="empty">Sin tareas.</div>'}</div>`;
  } else if (U.ag === 'Calendario') body = calendar();
  else if (U.ag === 'Eventos') {
    body = `<div class="list">${S.events.map(e => `<div class="row" style="border-left-color:var(--ev)">
      <span style="flex:1;min-width:0"><span class="ttl">${esc(e.title)}</span>
      <span class="meta">${dayLabel(e.date)} · ${e.time} · ${esc(e.place)}</span></span>
      <button class="x" data-act="del-ev" data-id="${e.id}">×</button></div>`).join('')}
      <button class="dash" data-act="new-ev">＋  Nuevo evento</button></div>`;
  } else {
    const p = sortedTasks(S.tasks.filter(t => !t.course));
    body = `<div class="list">${p.length ? p.map(taskRow).join('') : '<div class="empty">Nada personal pendiente.</div>'}
      <button class="dash" data-act="new">＋  Nueva tarea personal</button></div>`;

}

/* ------------------------------------------------------------------ render */
function render() {
  document.documentElement.dataset.theme = S.settings.theme;
  document.documentElement.dataset.scale = S.settings.scale;
  const app = document.getElementById('app');
  if (!S.onboarded) { app.innerHTML = onboarding(); return; }
  const d = new Date();
  const body = U.view === 'Hoy' ? viewHoy() : U.view === 'Agenda' ? viewAgenda()
             : U.view === 'Materias' ? viewMaterias() : viewDinero();
  const sheets = { task:sheetTask, new:sheetNew, event:sheetEvent, course:sheetCourse, tx:sheetTx,
                   acct:sheetAccount, search:sheetSearch, profile:sheetProfile, history:sheetHistory };
  app.innerHTML = `
    <header>
      <div style="flex:1;min-width:0">
        <div class="date">${DAYS[(d.getDay()+6)%7]} ${d.getDate()} de ${MONTHS[d.getMonth()]}</div>
        <h1>${U.view}</h1>
      </div>
      <button class="ghost" data-act="search">Buscar</button>
      <button class="avatar" data-act="profile">N${level()}</button>
    </header>
    <main>${body}</main>
    <button class="fab" data-act="new" aria-label="Nueva tarea">＋</button>
    <nav>${['Hoy','Agenda','Materias','Dinero'].map(v =>
      `<button data-act="view" data-v="${v}" ${U.view === v ? 'aria-current="page"' : ''}><i></i>${v}</button>`).join('')}</nav>
    ${U.sheet && sheets[U.sheet] ? sheets[U.sheet]() : ''}
    ${U.toast ? `<div class="toast">${U.toast}</div>` : ''}`;
  const q = document.getElementById('q'); if (q) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
}

/* ------------------------------------------------------------------ events */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, v = el.dataset.v, id = el.dataset.id;
  const t = () => S.tasks.find(x => x.id === U.sel);
  const stop = () => { e.preventDefault(); e.stopPropagation(); };

  switch (act) {
    case 'view': U.view = v; U.seg = 'Hoy'; break;
    case 'seg': U.seg = v; break;
    case 'ag': U.ag = v; break;
    case 'mon': U.mon = v; break;
    case 'txf': U.txf = v; break;
    case 'ptab': U.ptab = v; break;
    case 'day': U.day = v; break;
    case 'mon-': case 'mon+': {
      const b = new Date(U.day + 'T12:00'); b.setMonth(b.getMonth() + (act === 'mon+' ? 1 : -1));
      U.day = b.toISOString().slice(0,10); break;
    }
    case 'toggle': stop(); toggleTask(id); return;
    case 'toggle-close': toggleTask(id); U.sheet = null; return;
    case 'open': U.sheet = 'task'; U.sel = id; U.timer = { left:1500, run:false }; break;
    case 'focus': U.sheet = 'task'; U.sel = id; U.timer = { left:1500, run:true }; break;
    case 'new': U.sheet = 'new'; U.draft = { course:S.courses[0] ? S.courses[0].id : '', pri:'Media', dif:'Media', rec:'No se repite', date:today() }; break;
    case 'new-ev': U.sheet = 'event'; break;
    case 'new-course': U.sheet = 'course'; U.sel = null; U.draft = { days:[] }; break;
    case 'course': U.sheet = 'course'; U.sel = id; U.draft = { days:(course(id)||{}).days || [] }; break;
    case 'new-tx': U.sheet = 'tx'; U.draft = { kind:v || 'Gasto', cat:'Comida', acct:S.accounts[0].id }; break;
    case 'new-acct': U.sheet = 'acct'; U.draft = { kind:'Débito' }; break;
    case 'search': U.sheet = 'search'; U.q = ''; break;
    case 'profile': U.sheet = 'profile'; break;
    case 'hist': U.sheet = 'history'; break;
    case 'close': U.sheet = null; break;
    case 'close-bg': if (e.target.classList.contains('scrim')) U.sheet = null; else return; break;

    case 'set': patchTask(U.sel, { [el.dataset.k]: v }); break;
    case 'set-pri': patchTask(U.sel, { pri:v }); break;
    case 'set-dif': patchTask(U.sel, { dif:v }); break;
    case 'set-rec': patchTask(U.sel, { rec:v }); break;
    case 'set-rem': patchTask(U.sel, { rem:v }); break;
    case 'del-task': delTask(id); U.sheet = null; toast('Tarea eliminada'); return;
    case 'sub': { const k = t(); k.subs[+el.dataset.i].done = !k.subs[+el.dataset.i].done; save(); break; }
    case 'sub-del': { const k = t(); k.subs.splice(+el.dataset.i, 1); save(); break; }
    case 'timer': U.timer.run = !U.timer.run; break;
    case 'timer-reset': U.timer = { left:1500, run:false }; break;

    case 'd': U.draft[el.dataset.k] = v; break;
    case 'day-toggle': {
      const i = +v, arr = U.draft.days || [];
      U.draft.days = arr.indexOf(i) >= 0 ? arr.filter(x => x !== i) : arr.concat([i]);
      break;
    }
    case 'del-ev': S.events = S.events.filter(x => x.id !== id); save(); break;
    case 'del-course': case 'del-course-q':
      S.courses = S.courses.filter(c => c.id !== id);
      S.tasks.forEach(x => { if (x.course === id) x.course = ''; });
      save(); if (act === 'del-course') U.sheet = null; break;

    case 'theme': S.settings.theme = v; save(); break;
    case 'scale': S.settings.scale = v; save(); break;
    case 'notif': S.settings.notif[v] = !S.settings.notif[v]; save(); break;
    case 'export': {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([JSON.stringify(S, null, 2)], { type:'application/json' }));
      a.download = 'quest-log-' + today() + '.json'; a.click();
      toast('Datos exportados'); return;
    }
    case 'import': document.getElementById('file').click(); return;
    case 'reset': if (confirm('¿Borrar todos los datos y empezar de cero?')) { S = seed(); save(); U.sheet = null; U.step = 0; } break;

    case 'step': U.step = +v; if (U.step > 4) U.step = 4; U.draft = { days:[] }; break;
    case 'skip': case 'finish': S.onboarded = true; save(); U.view = 'Hoy'; break;
    case 'prof-sem': S.profile.sem = v; save(); break;
    case 'prof-goal': S.profile.goal = v; save(); break;
    case 'prof-hour': S.profile.hour = v; save(); break;
    default: return;
  }
  render();
});

document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-act]'); if (!f) return;
  e.preventDefault();
  const g = n => (f.elements[n] ? f.elements[n].value.trim() : '');
  switch (f.dataset.act) {
    case 'save-task': {
      if (!g('title')) return;
      addTask(Object.assign({}, U.draft, { title:g('title'), date:g('date'), time:g('time') }));
      U.sheet = null; toast('Tarea agregada'); break;
    }
    case 'save-event':
      S.events.push({ id:uid('e'), title:g('title'), date:g('date'), time:g('time'), place:g('place') || 'Sin lugar' });
      save(); U.sheet = null; toast('Evento agregado'); break;
    case 'save-course': {
      if (!g('name')) return;
      const id = g('id');
      if (id) { Object.assign(course(id), { name:g('name'), room:g('room'), hour:g('hour'), days:U.draft.days || [] }); }
      else S.courses.push({ id:uid('c'), name:g('name'), room:g('room'), hour:g('hour'), days:U.draft.days || [] });
      save(); U.sheet = null; toast('Materia guardada'); break;
    }
    case 'ob-course': {
      if (!g('name')) return;
      S.courses.push({ id:uid('c'), name:g('name'), room:g('room'), hour:g('hour'), days:U.draft.days || [] });
      U.draft = { days:[] }; save(); f.reset(); break;
    }
    case 'save-tx': {
      const ok = addTx(Object.assign({}, U.draft, { amount:g('amount') }));
      if (!ok) return; U.sheet = null; toast('Movimiento guardado'); break;
    }
    case 'save-acct': {
      S.accounts.push({ id:uid('a'), name:g('name'), kind:U.draft.kind || 'Débito',
                        balance:parseFloat(g('balance')) || 0, credit:U.draft.kind === 'Crédito', limit:8000 });
      save(); U.sheet = null; toast('Cuenta agregada'); break;
    }
    case 'sub-add': {
      const val = g('sub'); if (!val) return;
      const k = S.tasks.find(x => x.id === U.sel); k.subs.push({ t:val, done:false }); save(); break;
    }
    default: return;
  }
  render();
});

document.addEventListener('input', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  if (el.dataset.act === 'edit') { patchTask(U.sel, { [el.dataset.k]: el.value }); return; }
  if (el.dataset.act === 'prof') { S.profile[el.dataset.k] = el.value; save(); return; }
  if (el.dataset.act === 'query') { U.q = el.value; render(); }
});

document.addEventListener('change', e => {
  if (e.target.id !== 'file') return;
  const file = e.target.files[0]; if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    try { const data = JSON.parse(r.result); if (data.tasks) { S = data; save(); U.sheet = null; render(); toast('Datos importados'); } }
    catch (err) { alert('Archivo no válido'); }
  };
  r.readAsText(file);
});

setInterval(() => {
  if (U.timer.run && U.timer.left > 0 && U.sheet === 'task') {
    U.timer.left--;
    if (U.timer.left === 0) { U.timer.run = false; toast('Sesión de enfoque terminada'); }
    render();
  }
}, 1000);

render();
</script>
</body>
</html>
